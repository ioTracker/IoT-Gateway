image: node:20

variables:
  DO_REGISTRY_IMAGE: registry.digitalocean.com/iotracker/lte-server
  DOCKERHUB_IMAGE: iothingsio/iot-gateway

stages:
  - test
  - build
  - sync

cache:
  paths:
    - node_modules/

test:
  stage: test
  script:
    - npm install
    - npm test

build-tlv-markdown:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - tlv-tag-spec.json
        - scripts/generate-tlv-markdown.js
        - package.json
        - package-lock.json
  script:
    - npm ci
    - npm run generate:tlv-md
    - git diff --quiet -- tlv-tag-spec.md && exit 0
    - git config user.name "ioThings CI"
    - git config user.email "ci@iothings.nl"
    - git add tlv-tag-spec.md
    - git commit -m "Update generated TLV markdown [skip ci]"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_COMMIT_REF_NAME}" -o ci.skip

build-docker:
  stage: build
  image: docker:stable
  services:
    -   name: docker:dind
  script:
    - docker login -u "$DIGITALOCEAN_TOKEN" -p "$DIGITALOCEAN_TOKEN" registry.digitalocean.com
    - docker build
      --pull
      -t "$DO_REGISTRY_IMAGE:latest"
      -t "$DO_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      .
    - docker push "$DO_REGISTRY_IMAGE:latest"
    - docker push "$DO_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

publish-dockerhub-tag:
  stage: build
  image: docker:stable
  services:
    - name: docker:dind
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build
      --pull
      -t "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"
      .
    - docker push "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"

sync-tlv-debugger-spec:
  stage: sync
  image: node:22-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - tlv-tag-spec.json
  before_script:
    - apk add --no-cache bash git
  script:
    - git clone --depth 1 --branch "$CI_DEFAULT_BRANCH" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/iothings-v2/apps/tlv-debugger.git" tlv-debugger
    - git -C tlv-debugger config user.name "ioThings CI"
    - git -C tlv-debugger config user.email "ci@iothings.nl"
    - bash scripts/sync-tlv-debugger-spec.sh tlv-tag-spec.json tlv-debugger "$CI_DEFAULT_BRANCH" "$CI_PROJECT_PATH" "$CI_COMMIT_SHORT_SHA"

publish-clean-github-tag:
  stage: sync
  image: node:22-alpine
  variables:
    GIT_DEPTH: 0
    GITHUB_CLEAN_BRANCH: main
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache bash git
    - ': "${GITHUB_CLEAN_REPOSITORY:?Set this CI/CD variable to owner/repository}"'
    - ': "${GITHUB_TOKEN:?Set this masked CI/CD variable}"'
    - git fetch origin --tags --force
    - git config user.name "ioThings CI"
    - git config user.email "ci@iothings.nl"
  script:
    - npm run publish:clean-tags -- "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_CLEAN_REPOSITORY}.git" --branch "$GITHUB_CLEAN_BRANCH" "$CI_COMMIT_TAG"
